services:
  - type: web
    name: dropbox-upload-by-ak
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python main.py"
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: DROPBOX_ACCESS_TOKEN
        sync: false
      - key: WEBHOOK_URL
        sync: false